name: Validate and package ResumeForge
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Locate Chromium for PDF integration tests
        run: |
          CHROMIUM_PATH="$(node -p "require('@playwright/test').chromium.executablePath()")"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env: {CHROMIUM_NO_SANDBOX: 'true'}
      - run: npm run build
      - run: npm run db:seed
      - run: npm run test:e2e
        env: {CI: 'true', CHROMIUM_NO_SANDBOX: 'true'}
      - uses: actions/upload-artifact@v4
        with: {name: deploy-ready, path: "dist/\ninfra/\nserver/migrations/\nshared/resume.css\nDockerfile\ndocker-compose.yml"}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-test-results, path: "test-results/\nplaywright-report/"}
  images:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    strategy:
      matrix: {target: [frontend, backend]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Normalize image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.target }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: '${{ matrix.target }}'
          push: true
          tags: '${{ env.IMAGE }}:${{ github.sha }}'
          cache-from: 'type=gha,scope=${{ matrix.target }}'
          cache-to: 'type=gha,mode=max,scope=${{ matrix.target }}'
