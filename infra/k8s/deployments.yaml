apiVersion: apps/v1
kind: Deployment
metadata: {name: backend}
spec:
  replicas: 2
  selector: {matchLabels: {app: resumeforge-api}}
  template:
    metadata: {labels: {app: resumeforge-api}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/REPLACE_OWNER/resumeforge-backend:REPLACE_SHA
          ports: [{containerPort: 4000}]
          envFrom: [{configMapRef: {name: resumeforge-config}}, {secretRef: {name: resumeforge-secrets}}]
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: '2', memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: temporary, mountPath: /tmp}, {name: shared-memory, mountPath: /dev/shm}]
          startupProbe: {httpGet: {path: /api/health, port: 4000}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /api/health, port: 4000}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: 4000}, periodSeconds: 30}
      volumes: [{name: temporary, emptyDir: {}}, {name: shared-memory, emptyDir: {medium: Memory, sizeLimit: 512Mi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec:
  replicas: 2
  selector: {matchLabels: {app: resumeforge-web}}
  template:
    metadata: {labels: {app: resumeforge-web}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: ghcr.io/REPLACE_OWNER/resumeforge-frontend:REPLACE_SHA
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 500m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 10}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: resumeforge-worker}
spec:
  replicas: 1
  selector: {matchLabels: {app: resumeforge-worker}}
  template:
    metadata: {labels: {app: resumeforge-worker}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/REPLACE_OWNER/resumeforge-backend:REPLACE_SHA
          command: [node, dist/server/worker.js]
          envFrom: [{configMapRef: {name: resumeforge-config}}, {secretRef: {name: resumeforge-secrets}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
